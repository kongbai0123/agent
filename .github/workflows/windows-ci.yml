name: Windows deterministic CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "v*"
      - "codex/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify public repository boundary
        shell: pwsh
        run: .\scripts\check_public_tree.ps1

      - name: Configure Windows runner paths
        shell: pwsh
        run: |
          "WORKBENCH_RUNTIME_DIR=$(Join-Path $env:RUNNER_TEMP 'workbench-ci-runtime')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WORKBENCH_SETTINGS_PATH=$(Join-Path $env:RUNNER_TEMP 'workbench-ci-settings.json')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HF_HOME=$(Join-Path $env:RUNNER_TEMP 'huggingface')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.HF_HOME }}
          key: windows-hf-cache-v1

      - name: Prepare isolated settings
        shell: pwsh
        run: Copy-Item backend\settings.json.example $env:WORKBENCH_SETTINGS_PATH

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r backend\requirements.lock
          python -m pip install pytest==8.2.2 pip-audit

      - name: Inventory Python dependency vulnerabilities
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          python -m pip_audit -r backend\requirements.lock --format json --output artifacts\pip-audit.json
          $auditExit = $LASTEXITCODE
          if ($auditExit -gt 1) {
            throw "pip-audit could not complete (exit $auditExit)"
          }
          if ($auditExit -eq 1) {
            Write-Warning "Known vulnerabilities were found; see the uploaded inventory."
          }
          exit 0

      - name: Gate on new dependency vulnerabilities
        shell: pwsh
        run: |
          # A ratchet, not a threshold: security/audit-baseline.json lists what is
          # already known and accepted, so only *new* findings fail the build.
          # On a repository whose baseline has never been seeded this step fails
          # by design; the message says which single command fixes it.
          python scripts\check_dependency_audit.py --audit artifacts\pip-audit.json

      - name: Compile Python
        run: python -m compileall -q backend scripts

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object {
                Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)"
              }
            }
          }
          if ($failed) { exit 1 }

      - name: Check frontend JavaScript
        run: |
          Get-ChildItem frontend -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run deterministic test suite
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest tests -q --junitxml=artifacts\windows-tests.xml

      - name: Upload deterministic test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-deterministic-test-report
          path: artifacts\windows-tests.xml
          if-no-files-found: warn

      - name: Upload dependency audit inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-python-dependency-audit
          path: artifacts\pip-audit.json
          if-no-files-found: warn
