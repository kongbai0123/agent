model:
  default: "gemma4-hermes:latest"
  provider: "custom"
  base_url: "http://host.docker.internal:11434/v1"
  context_length: 64000
  max_tokens: 4096

# Only the Workbench-owned custom toolset is exposed. Hermes' stock `file`
# bundle remains disabled because it also includes write_file and patch.
toolsets:
  - workbench-readonly
platform_toolsets:
  api_server:
    - workbench-readonly

mcp_servers: {}
plugins:
  enabled: []
  disabled: []

agent:
  disabled_toolsets:
    - web
    - browser
    - terminal
    - file
    - code_execution
    - vision
    - video
    - image_gen
    - video_gen
    - x_search
    - tts
    - skills
    - todo
    - memory
    - context_engine
    - session_search
    - clarify
    - delegation
    - cronjob
    - homeassistant
    - spotify
    - discord
    - discord_admin
    - yuanbao
    - computer_use
  verify_on_stop: false

approvals:
  mode: manual

display:
  tool_progress: all

_config_version: 33
